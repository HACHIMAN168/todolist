<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的待办清单</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>🌸 我的待办清单</h1>
      <p class="subtitle">把每一天安排得明明白白</p>
    </header>

    <div class="stats">
      <div class="stat-card">
        <span class="stat-number" id="totalCount">0</span>
        <span class="stat-label">总任务</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="pendingCount">0</span>
        <span class="stat-label">未完成</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="completedCount">0</span>
        <span class="stat-label">已完成</span>
      </div>
    </div>

    <form id="todoForm" class="todo-form" autocomplete="off">
      <div class="form-row">
        <input
          type="text"
          id="todoInput"
          placeholder="今天要做什么？"
          maxlength="200"
          aria-label="新任务内容"
        >
        <button type="submit" id="addBtn" class="btn-add">➕ 添加任务</button>
      </div>
      <div class="priority-row">
        <span class="priority-label">优先级</span>
        <div class="priority-select" role="radiogroup" aria-label="选择优先级">
          <button type="button" class="pri-btn pri-opt-high" data-priority="high">高</button>
          <button type="button" class="pri-btn pri-opt-medium" data-priority="medium">中</button>
          <button type="button" class="pri-btn pri-opt-low active" data-priority="low">低</button>
        </div>
      </div>
    </form>

    <!-- 空列表时的友好提示 -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🌱</div>
      <p class="empty-title">清单还是空的</p>
      <p class="empty-sub">在上方输入任务内容，按回车或点击「➕ 添加任务」<br>开始今天的规划吧～</p>
    </div>

    <main class="lists" id="lists">
      <section class="list-section">
        <div class="section-header">
          <h2>📌 进行中</h2>
          <span class="section-count" id="pendingSectionCount">0</span>
        </div>
        <ul id="pendingList" class="todo-list" aria-live="polite"></ul>
        <p class="empty-tip" id="emptyPendingTip">全部完成啦，真棒 🎉</p>
      </section>

      <section class="list-section" id="completedSection">
        <div class="section-header">
          <h2>✅ 已完成</h2>
          <div class="section-header-right">
            <span class="section-count" id="completedSectionCount">0</span>
            <button type="button" id="clearCompletedBtn" class="btn-clear" disabled>🗑 清空已完成</button>
          </div>
        </div>
        <ul id="completedList" class="todo-list" aria-live="polite"></ul>
      </section>
    </main>

    <footer class="footer-actions">
      <button type="button" id="clearAllBtn" class="btn-clear-all" disabled>🗑 全部清空</button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
